name: Свежие посты из блога

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://dimafaller.ru/blog/rss.xml"
          max_post_count: 3
          template: "$newline- [$title]($url) · <sub>$date</sub>"
          date_format: "dd.mm.yyyy"
          commit_message: "Обновил посты из блога"
